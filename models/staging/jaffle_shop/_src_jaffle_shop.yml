sources:
  - name: jaffle_shop
    database: dbt-tutorial
    schema: jaffle_shop
    description: a clone of a postgres application database.
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 1
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        description: Raw customers data. One row per customer.
        columns:
          - name: id
            description: Primary key for customers.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name.
          - name: last_name
            description: Customer's last name initial.

      - name: orders
        description: Raw orders data. One row per order.
        columns:
          - name: id
            description: Primary key for orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Foreign key to customers.id.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed.
          - name: status
            description: "{{ doc('order_status') }}"
          - name: _etl_loaded_at
            description: Timestamp when the row was loaded into the warehouse. Used for source freshness.
