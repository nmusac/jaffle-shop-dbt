sources:
  - name: stripe
    database: dbt-tutorial
    schema: stripe
    tables:
      - name: payment
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: orderid
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'orders')
                    field: id
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      - success
                      - fail
